[project]
name = "antisentinel"
version = "0.1.0"
description = "Code-aware incident diagnosis and runbook execution platform"
requires-python = ">=3.11,<4"
dependencies = [
    "fastapi>=0.100",
    "httpx>=0.27",
    "uvicorn>=0.30",
    "redis>=5.0",
    "opentelemetry-api>=1.39",
    "opentelemetry-sdk>=1.39",
    "opentelemetry-exporter-otlp-proto-grpc>=1.39",
    "prometheus-client>=0.22",
    "tree-sitter>=0.25",
    "tree-sitter-language-pack>=0.10",
    "pymilvus[milvus-lite]==3.0.1",
    "milvus-lite==3.2.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
ragas-evaluation = [
    "ragas==0.4.3",
    "langchain==0.3.27",
    "langchain-core==0.3.80",
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "instructor==1.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
